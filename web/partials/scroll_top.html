{{define "scroll_top"}}
<button id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top">&#9650;</button>
<style>
#scroll-top {
  display: none; position: fixed; bottom: 24px; right: 24px; z-index: 900;
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid #e94560;
  background: #16213e; color: #e94560; font-size: 18px; cursor: pointer;
  opacity: 0.8; transition: opacity 0.2s;
}
#scroll-top:hover { opacity: 1; }
</style>
<script>
(function(){
  var btn=document.getElementById('scroll-top');
  window.addEventListener('scroll',function(){
    btn.style.display=window.scrollY>300?'block':'none';
  });
})();
</script>
{{end}}
